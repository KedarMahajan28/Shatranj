services:
  mongodb:
    image: mongo:6.0-jammy
    container_name: shatranj-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - shatranj-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: shatranj-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGODB_URL=mongodb://mongodb:27017
      - CORS_ORIGIN=http://localhost:3000
      - ACCESS_TOKEN_SECRET=qwertyuiop098123456784
      - ACCESS_TOKEN_EXPIRY=1d
      - REFRESH_TOKEN_SECRET=updatethisthing434343
      - REFRESH_TOKEN_EXPIRY=10d
    depends_on:
      - mongodb
    networks:
      - shatranj-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_FRONTEND_URL=http://localhost:3000
    container_name: shatranj-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - shatranj-network

volumes:
  mongo-data:

networks:
  shatranj-network:
    driver: bridge
